<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; overflow: hidden; cursor: crosshair; background: #87CEEB; }
        #game-container { width: 100vw; height: 100vh; position: relative; }
        .target { width: 50px; height: 50px; background: red; position: absolute; border-radius: 50%; }
    </style>
</head>
<body>

<div id="game-container"></div>

<script>
    const container = document.getElementById('game-container');

    function createTarget() {
        const target = document.createElement('div');
        target.className = 'target';
        target.style.left = Math.random() * (window.innerWidth - 50) + 'px';
        target.style.top = Math.random() * (window.innerHeight - 50) + 'px';
        
        target.onclick = function() {
            this.remove(); // "Acertou o alvo"
            createTarget(); // Cria o próximo
        };

        container.appendChild(target);
    }

    createTarget(); // Inicia o primeiro alvo
</script>
</body>
</html>
